name: Telloria Web CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, test, build, and budget
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn

      - name: Activate Yarn
        run: corepack prepare yarn@1.22.19 --activate

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm run test:ci

      - name: Build production bundle
        run: npm run build

      - name: Enforce bundle budget
        run: npm run check:web-budget
